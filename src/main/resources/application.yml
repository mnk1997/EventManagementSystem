spring:
  application:
    name: event-booking-system
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/event_booking}
    username: ${DB_USERNAME:event_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLE:true}
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:10000}
      mail.smtp.timeout: ${SMTP_TIMEOUT_MS:20000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:20000}
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true
info:
  app:
    name: Event Booking System
    version: 0.1.0-SNAPSHOT
app:
  jwt:
    secret: ${JWT_SECRET_BASE64}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  booking:
    max-tickets-per-customer: ${BOOKING_MAX_TICKETS_PER_CUSTOMER:5}
  email:
    from: ${SMTP_FROM:no-reply@example.invalid}
    worker:
      enabled: ${EMAIL_WORKER_ENABLED:true}
      fixed-delay-ms: ${EMAIL_WORKER_FIXED_DELAY_MS:5000}
      batch-size: ${EMAIL_WORKER_BATCH_SIZE:25}
      max-attempts: ${EMAIL_WORKER_MAX_ATTEMPTS:5}
      initial-backoff-seconds: ${EMAIL_WORKER_INITIAL_BACKOFF_SECONDS:30}
      max-backoff-seconds: ${EMAIL_WORKER_MAX_BACKOFF_SECONDS:900}
      lease-seconds: ${EMAIL_WORKER_LEASE_SECONDS:600}
